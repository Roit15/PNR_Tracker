server {
    listen 80;
    server_name balireserve.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name balireserve.com;

    # SSL certs (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/balireserve.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balireserve.com/privkey.pem;

    # PNR Tracker app
    location /pnr/ {
        proxy_pass http://127.0.0.1:8080/pnr/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Increase timeouts for long scraping operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;

        # File upload size (for PDFs)
        client_max_body_size 16M;
    }
}
